<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waktu Solat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #84286b;
      color: white;
    }
    .card {
      border-radius: 15px;
      overflow: hidden;
    }
    .text-center h4, .text-center .clock {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card">
      <div class="card-header bg-white text-center">
        <h4 class="fw-bold">Waktu Solat</h4>
        <div class="clock fs-4 text-dark">Loading...</div>
      </div>
      <div class="card-body bg-light text-dark">
        <p class="text-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
            <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
          </svg>
          Petaling Jaya
        </p>
        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center">Imsak<span class="badge text-bg-primary rounded-pill imsak">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Subuh<span class="badge text-bg-primary rounded-pill subuh">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Syuruk<span class="badge text-bg-primary rounded-pill syuruk">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Dhuha<span class="badge text-bg-primary rounded-pill dhuha">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Zohor<span class="badge text-bg-primary rounded-pill zohor">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Asar<span class="badge text-bg-primary rounded-pill asar">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Maghrib<span class="badge text-bg-primary rounded-pill maghrib">N/A</span></li>
          <li class="list-group-item d-flex justify-content-between align-items-center">Isyak<span class="badge text-bg-primary rounded-pill isyak">N/A</span></li>
        </ul>
      </div>
      <div class="card-footer text-center text-dark bg-white">
        <span class="date">Loading date...</span>
      </div>
    </div>
  </div>

  <script>
    // Simulated prayer times data (use an API for real data)
    const prayerTimes = {
      imsak: "06:02",
      subuh: "06:12",
      syuruk: "07:18",
      dhuha: "07:43",
      zohor: "13:25",
      asar: "16:32",
      maghrib: "19:27",
      isyak: "20:36"
    };

    // Update prayer times
    function updatePrayerTimes() {
      document.querySelector('.imsak').textContent = prayerTimes.imsak;
      document.querySelector('.subuh').textContent = prayerTimes.subuh;
      document.querySelector('.syuruk').textContent = prayerTimes.syuruk;
      document.querySelector('.dhuha').textContent = prayerTimes.dhuha;
      document.querySelector('.zohor').textContent = prayerTimes.zohor;
      document.querySelector('.asar').textContent = prayerTimes.asar;
      document.querySelector('.maghrib').textContent = prayerTimes.maghrib;
      document.querySelector('.isyak').textContent = prayerTimes.isyak;
    }

    // Update date
    function updateDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.querySelector('.date').textContent = now.toLocaleDateString('en-US', options); // Adjust locale as needed
    }

    // Update clock
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { hour12: false });
      document.querySelector('.clock').textContent = timeString;
    }

    // Initialize
    function initialize() {
      updatePrayerTimes();
      updateDate();
      updateClock();
      setInterval(updateClock, 1000); // Update clock every second
    }

    initialize();
  </script>
</body>
</html>
